<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Kael</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header class="page-header">
            <h1 class="page-title">Contact</h1>
            <p class="page-description">Discutons de votre projet et voyons comment Kael peut vous aider</p>
        </header>

        <div class="content-section">
            <div class="contact-content">
                <div class="contact-info">
                    <h2 class="section-title">Restons en contact</h2>
                    <p class="section-content">Vous avez des questions ou souhaitez discuter de votre projet ? N'hésitez pas à me contacter.</p>
                    
                    <div class="contact-details">
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <span>contact@kael.ai</span>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Paris, France</span>
                        </div>
                    </div>
                </div>
                
                <div class="contact-form">
                    <h2 class="section-title">Envoyez-moi un message</h2>
                    <form id="contactForm">
                        <div class="form-group">
                            <input type="text" placeholder="Votre nom" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Votre email" required>
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Votre message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn">Envoyer le message</button>
                    </form>
                </div>
            </div>
        </div>

        <footer class="page-footer">
            <p>&copy; 2023 Kael. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
